# Benchmark harness on an x86 Linux runner (4 KB pages, THP madvise), separate from the
# submission. Generates a 20M-event dataset with the official generator into tmpfs, as on the
# scorer, and times the given commits.
name: bench
on:
  push:
    branches: [bench]
    paths: ['.github/workflows/bench.yml']
  workflow_dispatch:
    inputs:
      shas:
        description: commits to time
        default: "1e589b6 c97bfa7"
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: machine
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Flags' | cut -c1-200
          cat /sys/kernel/mm/transparent_hugepage/enabled; free -g; uname -r
      - name: generate 20M into tmpfs
        run: |
          cd tools/generator && cargo build --release -q && cd -
          time tools/generator/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output /dev/shm/s20
          du -sh /dev/shm/s20
      - name: build commits
        run: |
          SHAS="${{ github.event.inputs.shas }}"; SHAS="${SHAS:-1e589b6 c97bfa7}"
          echo "SHAS=$SHAS" >> $GITHUB_ENV
          for s in $SHAS; do
            git worktree add -q /tmp/b-$s $s
            (cd /tmp/b-$s && RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q)
          done
      - name: time
        run: |
          run() { # label, binary, env...
            local label=$1 bin=$2; shift 2
            rm -rf /tmp/out
            env "$@" NCPU=4 /usr/bin/time -f "WALL %e s  user %U  sys %S  maxrss %M KB  minflt %R" $bin /dev/shm/s20 /tmp/out 2>/tmp/err
            echo "== $label: $(grep WALL /tmp/err)"; grep -E 'ms\]' /tmp/err | tr '\n' ' ' | sed 's/  */ /g'; echo
          }
          for i in 1 2 3; do
            for s in $SHAS; do
              run "$s default" /tmp/b-$s/target/release/sessions
              run "$s hugetlb=1" /tmp/b-$s/target/release/sessions GLIBC_TUNABLES=glibc.malloc.hugetlb=1
              run "$s hugetlb=0" /tmp/b-$s/target/release/sessions GLIBC_TUNABLES=glibc.malloc.hugetlb=0
            done
          done
      - name: check outputs agree
        run: |
          pip install -q pyarrow polars
          set -- $SHAS
          for s in "$@"; do rm -rf /tmp/o-$s; SS_QUIET=1 /tmp/b-$s/target/release/sessions /dev/shm/s20 /tmp/o-$s; done
          python3 /tmp/b-$1/scripts/compare.py /tmp/o-$1 /tmp/o-$2 | tail -2
