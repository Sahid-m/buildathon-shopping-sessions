# Benchmark harness on an x86 Linux runner (4 KB pages, THP madvise), separate from the
# submission. Generates a 20M-event dataset with the official generator into tmpfs, as on the
# scorer, and times the given commits.
name: bench
env:
  VARIANTS: "2921d31:x86-64-v3 1b5477f:x86-64-v3 125ac7b:x86-64-v3 4b93fd0:x86-64-v3"
on:
  push:
    branches: [bench]
    paths: ['.github/workflows/bench.yml']
  workflow_dispatch:
    inputs:
      shas:
        description: commits to time
        default: "1e589b6 c97bfa7"
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: machine
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread'; grep -o 'avx512[a-z]*' /proc/cpuinfo | sort -u | tr '\n' ' '
          cat /sys/kernel/mm/transparent_hugepage/enabled; free -g; uname -r
      - name: generate 20M into tmpfs
        run: |
          cd tools/generator && cargo build --release -q && cd -
          time tools/generator/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output /dev/shm/s20
          du -sh /dev/shm/s20
      - name: build commits
        run: |
          SHAS="${VARIANTS}"
          echo "SHAS=$SHAS" >> $GITHUB_ENV
          for v in $SHAS; do
            sha=$(echo $v | cut -d: -f1); cpu=$(echo $v | cut -d: -f2)
            [ -d /tmp/src-$sha ] || git worktree add -q /tmp/src-$sha $sha
            d=/tmp/b-$sha-$cpu
            rm -rf $d; cp -r /tmp/src-$sha $d
            (cd $d && RUSTFLAGS="-C target-cpu=$cpu" cargo build --release -q)
          done
      - name: time
        run: |
          run() { # label, binary, env...
            local label=$1 bin=$2; shift 2
            rm -rf /tmp/out
            env NCPU=4 "$@" /usr/bin/time -f "WALL %e s  user %U  sys %S  maxrss %M KB  minflt %R" $bin /dev/shm/s20 /tmp/out 2>/tmp/err
            echo "== $label: $(grep WALL /tmp/err)"; grep -E 'ms\]' /tmp/err | tr '\n' ' ' | sed 's/  */ /g'; echo
          }
          for i in 1 2 3 4; do
            for s in $SHAS; do
              sha=$(echo $s | cut -d: -f1); cpu=$(echo $s | cut -d: -f2); ev=$(echo $s | cut -d: -f3)
              run "$s" /tmp/b-$sha-$cpu/target/release/sessions $ev
            done
          done
      - name: check outputs agree
        run: |
          pip install -q pyarrow polars
          set -- $SHAS
          i=0; for s in "$@"; do i=$((i+1)); sha=$(echo $s | cut -d: -f1); cpu=$(echo $s | cut -d: -f2); rm -rf /tmp/o-$i; SS_QUIET=1 /tmp/b-$sha-$cpu/target/release/sessions /dev/shm/s20 /tmp/o-$i; done
          for j in $(seq 2 $i); do python3 /tmp/src-$(echo $1 | cut -d: -f1)/scripts/compare.py /tmp/o-1 /tmp/o-$j 2>&1 | tail -1; done
